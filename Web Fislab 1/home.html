<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - FISLAB I</title>
    <style>
        :root {
            --primary-gold: #cfa330;
            --dark-bg: #1a1a1a;
            --text-color: #000000;
        }

        body {
            margin: 0;
            font-family: 'Times New Roman', serif;
            background-color: var(--primary-gold);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* Header pojok kiri atas */
        .top-left-header {
            position: fixed;
            top: 16px;
            left: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-color);
            z-index: 1000;
        }
        .top-left-header .header-logo {
            font-size: 1.8rem;
            line-height: 1;
            transition: transform 0.8s ease;
        }
        .top-left-header .header-text {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.9px;
            transition: transform 1.5s ease;
        }

        /* Tombol hamburger (3 garis) */
        .hamburger {
            width: 36px;
            height: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            color: inherit;
            border: 0;
            cursor: pointer;
            opacity: 0;
            transform: translateX(-8px) scale(0.9);
            transition: opacity 0.3s ease, transform 0.5s ease;
            pointer-events: none;
            padding: 0;
        }
        .hamburger .bar {
            width: 18px;
            height: 2px;
            background-color: currentColor;
            display: block;
            border-radius: 1px;
            transition: all 0.3s ease;
        }

        /* Saat menu ditampilkan */
        .top-left-header.menu-visible .hamburger {
            opacity: 1;
            transform: translateX(0) scale(1);
            pointer-events: auto;
        }
        .top-left-header.menu-visible .header-logo,
        .top-left-header.menu-visible .header-text {
            transform: translateX(10px);
        }
        .top-left-header.menu-visible .hamburger:hover {
            transform: translateX(0) scale(1.08);
        }

        /* Garis bawah header */
        .top-border-box {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            border: 0;
            border-bottom: 1px solid #000000;
            box-sizing: border-box;
            background-color: var(--primary-gold);
            pointer-events: none;
            z-index: 900;
        }

        /* Tombol night mode */
        .mode-toggle {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--text-color);
            color: var(--primary-gold);
            border: 1px solid rgba(0, 0, 0, 0.2);
            font-family: 'Times New Roman', serif;
            cursor: pointer;
            z-index: 1200;
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .mode-toggle:hover { transform: scale(1.06); }
        .mode-toggle .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }
        .mode-toggle:hover .icon {
            transform: rotate(15deg);
        }

        /* Konten utama */
        .page-container {
            max-width: 960px;
            margin: 100px auto 48px;
            padding: 0 16px;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 64px;
            left: 0;
            width: 260px;
            height: calc(100vh - 64px);
            background: var(--text-color);
            color: var(--primary-gold);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 950;
            box-shadow: 2px 0 14px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
        }
        .sidebar .side-title {
            font-weight: 700;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .sidebar nav { padding: 8px 0; }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: currentColor;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }
        .sidebar a:hover { 
            background-color: rgba(255,255,255,0.08); 
            transform: translateX(4px); 
        }
        .sidebar a.active { 
            background-color: var(--primary-gold); 
            color: var(--text-color); 
        }
        .sidebar a .icon { 
            width: 18px; 
            height: 18px; 
            display: inline-block; 
        }
        .sidebar a .icon svg { 
            width: 100%; 
            height: 100%; 
            fill: none; 
            stroke: currentColor; 
            stroke-width: 2; 
            stroke-linecap: round; 
            stroke-linejoin: round; 
        }

        /* Overlay */
        .sidebar-overlay {
            position: fixed;
            top: 64px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            z-index: 940;
        }

        /* Open state */
        body.sidebar-open .sidebar { transform: translateX(0); }
        body.sidebar-open .sidebar-overlay { opacity: 1; visibility: visible; }

        .welcome-card {
            background: var(--text-color);
            color: var(--primary-gold);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 0 12px rgba(0,0,0,0.25);
        }

        .welcome-title {
            margin: 0 0 8px;
            font-size: 2rem;
        }

        .welcome-subtitle {
            margin: 0 0 20px;
            font-size: 1rem;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary-gold);
            color: var(--text-color);
            border: none;
            padding: 12px 20px;
            font-family: 'Times New Roman', serif;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn:hover { 
            transform: scale(1.04); 
            box-shadow: 0 0 10px rgba(0,0,0,0.25); 
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary-gold);
            border: 1px solid var(--primary-gold);
        }

        /* Dark mode overrides */
        body.dark { 
            background-color: var(--dark-bg); 
            color: var(--primary-gold); 
        }
        body.dark .top-left-header { 
            color: var(--primary-gold); 
        }
        body.dark .top-border-box { 
            border-bottom-color: var(--primary-gold); 
            background-color: var(--dark-bg); 
        }
        body.dark .mode-toggle { 
            background-color: var(--primary-gold); 
            color: #1a1a1a; 
        }
        body.dark .mode-toggle .icon { 
            fill: #1a1a1a; 
        }
        body.dark .welcome-card { 
            background: #2a2a2a; 
            color: #ffffff; 
        }
        body.dark .btn { 
            background-color: var(--primary-gold); 
            color: #1a1a1a; 
        }
        body.dark .btn-secondary { 
            background-color: transparent; 
            color: var(--primary-gold); 
            border-color: var(--primary-gold); 
        }
        body.dark .sidebar { 
            background: #2a2a2a; 
            color: #ffffff; 
        }
        body.dark .sidebar a:hover { 
            background-color: rgba(207,163,48,0.15); 
        }
    </style>
</head>
<body>
    <header class="top-left-header" aria-label="Brand header">
        <button id="hamburger" class="hamburger" type="button" aria-label="Buka menu" aria-controls="sidebar" aria-expanded="false">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
        <span class="header-logo">Φ</span>
        <span class="header-text">FISLAB I</span>
    </header>
    <div class="top-border-box" aria-hidden="true"></div>
    <button id="mode-toggle" class="mode-toggle" type="button" aria-label="Toggle night mode">
        <svg class="icon sun-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg class="icon moon-icon" viewBox="0 0 24 24" aria-hidden="true" style="display: none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>

    <aside id="sidebar" class="sidebar" aria-label="Sidebar navigasi">
        <div class="side-title">Menu</div>
        <nav>
            <a href="profile.html" id="nav-profile">
                <span class="icon" aria-hidden="true">

                </span>

                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="8" height="8" rx="1"/>
                        <rect x="13" y="3" width="8" height="8" rx="1"/>
                        <rect x="3" y="13" width="8" height="8" rx="1"/>
                        <rect x="13" y="13" width="8" height="8" rx="1"/>
                    </svg>
                </span>
                <span class="label">Dashboard</span>
            </a>

            </a>
            <a href="kontak.html" id="nav-contacts">

                    </svg>
                </span>
                <span class="label">Kontak Asisten Laboratorium</span>
            </a>
            <a href="nilai.html" id="nav-nilai" style="display: none;">
                <span class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 12l2 2 4-4"/>

                    </svg>
                </span>
                <span class="label">Nilai Praktikum</span>
            </a>
            <a href="penilaian.html" id="nav-penilaian" style="display: none;">
                <span class="icon" aria-hidden="true">

                        <path d="M9 12l2 2 4-4"/>

            </a>
            <a href="penjadwal.html" id="nav-penjadwalan" style="display: none;">
                <span class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                        <path d="M12 11h4"/>
                        <rect x="8" y="2" width="8" height="4" rx="1"/>
                    </svg>
                </span>
                <span class="label">Penjadwalan</span>
            </a>
            <a href="jadwal.html" id="nav-schedule">
                <span class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="17" rx="1"/>
                        <path d="M8 2v4M16 2v4M3 10h18"/>
                    </svg>
                </span>
                <span class="label">Jadwal Praktikum</span>
            </a>
            <a href="#" id="nav-logout">
                <span class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"/>
                        <path d="M14 16l4-4-4-4"/>
                        <path d="M8 12h10"/>
                    </svg>
                </span>
                <span class="label">Keluar</span>
            </a>
        </nav>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

    <main class="page-container">
        <section class="welcome-card" aria-labelledby="welcome-title">
            <h1 id="welcome-title" class="welcome-title">Selamat Datang di FISLAB I</h1>
            <p class="welcome-subtitle">Anda berhasil masuk. Silakan lanjutkan ke menu berikut.</p>
            <div class="actions">
                <button class="btn" type="button" id="mulai-btn">Mulai</button>
            </div>

    </main>

    <script src="sidebar.js"></script>
    <script>
        const mulaiBtn = document.getElementById('mulai-btn');
        mulaiBtn.addEventListener('click', () => {
            window.alert('Mulai eksplorasi FISLAB I!');
        });
    </script>
</body>
</html>
